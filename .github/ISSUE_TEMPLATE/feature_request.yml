name: ✨ 功能建议
description: 希望支持新平台、新能力，或改进现有体验
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议前请先看 README 的「平台支持」章节 —— 有些平台是**技术上做不到**，
        不是没做（比如抖音关键词搜索、微信视频号）。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是直接说方案
      placeholder: 我经常需要把一批 B站视频的要点整理成笔记，现在要一个个粘链接…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      placeholder: 支持传入一个 UP 主主页，自动批量提取近期视频的字幕
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 新平台支持
        - 现有平台的能力增强
        - 界面 / 交互
        - 输出格式
        - 性能
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我已阅读 README 的「平台支持」与「已知限制」
          required: true
        - label: 我已搜索过已有 issue
          required: true
